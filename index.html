<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord Service Manager</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #1e1e2f;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #2b2b3d;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .form, .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      padding: 0.8rem;
      font-size: 1rem;
      background-color: #5865f2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4752c4;
    }

    .requests {
      margin-top: 2rem;
    }

    .card {
      background-color: #373748;
      border-left: 5px solid #5865f2;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .card p {
      margin: 0.3rem 0;
    }

    .status {
      font-weight: bold;
      color: #00ffae;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }

    .accept {
      background-color: #2ecc71;
    }

    .reject {
      background-color: #e74c3c;
    }

    .accept:hover {
      background-color: #27ae60;
    }

    .reject:hover {
      background-color: #c0392b;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>📬 Discord Anfrage-Manager</h1>

  <div class="container">

    <!-- Kundenformular -->
    <form class="form" onsubmit="submitRequest(event)">
      <h2>📝 Anfrage stellen</h2>
      <input type="text" id="username" placeholder="Dein Discord-Name (z. B. user#1234)" required />
      <select id="service" required>
        <option value="">-- Service auswählen --</option>
        <option value="Logo Design">🖌 Logo Design</option>
        <option value="Banner Design">🖼 Banner Design</option>
        <option value="Website Design">🌐 Website Design</option>
        <option value="Sonstiges">❓ Sonstiges</option>
      </select>
      <textarea id="details" rows="4" placeholder="Beschreibe deine Anfrage..." required></textarea>
      <button type="submit">Anfrage absenden</button>
    </form>

    <!-- Admin-Login -->
    <div id="adminLogin" class="login-form">
      <h2>🔐 Admin Login</h2>
      <input type="password" id="adminPassword" placeholder="Passwort eingeben">
      <button onclick="login()">Login</button>
      <p style="font-size: 0.9rem; color: #aaa;">Passwort ist: <code>Fernando07.03.</code></p>
    </div>

    <!-- Admin-Panel -->
    <div id="adminPanel" class="requests hidden">
      <h2>📋 Offene Anfragen (nur für Admin)</h2>
      <div id="requestList"></div>
    </div>

  </div>

  <script>
    let requests = [];
    let isAdmin = false;

    const requestList = document.getElementById("requestList");
    const adminPanel = document.getElementById("adminPanel");
    const adminLogin = document.getElementById("adminLogin");

    function submitRequest(e) {
      e.preventDefault();
      const name = document.getElementById("username").value.trim();
      const service = document.getElementById("service").value;
      const details = document.getElementById("details").value.trim();

      const newRequest = {
        name,
        service,
        details,
        status: "⏳ Warten auf Bestätigung"
      };

      requests.push(newRequest);
      updateRequests();
      e.target.reset();
      alert("Anfrage erfolgreich gesendet!");
    }

    function updateRequests() {
      requestList.innerHTML = "";
      requests.forEach((req, i) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <p><strong>Kunde:</strong> ${req.name}</p>
          <p><strong>Service:</strong> ${req.service}</p>
          <p><strong>Details:</strong> ${req.details}</p>
          <p><strong>Status:</strong> <span class="status">${req.status}</span></p>
          ${isAdmin && req.status === "⏳ Warten auf Bestätigung" ? `
            <div class="actions">
              <button class="accept" onclick="accept(${i})">✅ Annehmen</button>
              <button class="reject" onclick="reject(${i})">❌ Ablehnen</button>
            </div>` : ""}
        `;
        requestList.appendChild(card);
      });
    }

    function login() {
      const input = document.getElementById("adminPassword").value;
      if (input === "Fernando07.03.") {
        isAdmin = true;
        adminPanel.classList.remove("hidden");
        adminLogin.classList.add("hidden");
        updateRequests();
      } else {
        alert("❌ Falsches Passwort!");
      }
    }

    function accept(i) {
      requests[i].status = "✅ Bestätigt – wird bearbeitet";
      updateRequests();
    }

    function reject(i) {
      requests[i].status = "❌ Abgelehnt – momentan keine Kapazität";
      updateRequests();
    }
  </script>
</body>
</html>
